<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4FB8">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rúbrica cuaderno 3º ESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: mobile-first single column, sticky header with group/unit pickers, bottom tab bar; notebook-grid paper as ground */
:root{
  --paper:#F5F7FB; --surface:#FFFFFF; --ink:#16203A; --muted:#58637F; --line:#D9DFEB;
  --grid:rgba(31,79,184,.07); --pen:#1F4FB8; --pen-ink:#FFFFFF; --pen-soft:#E3EAFA;
  --l4b:#D8EED5; --l4f:#1D6528; --l3b:#ECF1CB; --l3f:#545E0C; --l2b:#FBE8BE; --l2f:#744E00;
  --l1b:#F8D5BF; --l1f:#863611; --l0b:#F6CDD4; --l0f:#961A31; --warn:#9A5B00;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(22,32,58,.05),0 2px 8px rgba(22,32,58,.05); --shadow-lg:0 8px 28px rgba(22,32,58,.14);
  --pen-grad:linear-gradient(135deg,#2A5FD6,#1F4FB8 60%,#1A43A0);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1424; --surface:#171E33; --ink:#E5E9F4; --muted:#9AA4C0; --line:#2A3352;
  --grid:rgba(126,162,255,.06); --pen:#7EA2FF; --pen-ink:#0F1424; --pen-soft:#1F2B4D;
  --l4b:#1C3823; --l4f:#9EDCA8; --l3b:#30351A; --l3f:#D5DD8C; --l2b:#3B2F16; --l2f:#F0C56C;
  --l1b:#40261A; --l1f:#F2AA84; --l0b:#43202A; --l0f:#F49AAB; --warn:#F0C56C; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.45); --pen-grad:linear-gradient(135deg,#97B5FF,#7EA2FF); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1424; --surface:#171E33; --ink:#E5E9F4; --muted:#9AA4C0; --line:#2A3352;
  --grid:rgba(126,162,255,.06); --pen:#7EA2FF; --pen-ink:#0F1424; --pen-soft:#1F2B4D;
  --l4b:#1C3823; --l4f:#9EDCA8; --l3b:#30351A; --l3f:#D5DD8C; --l2b:#3B2F16; --l2f:#F0C56C;
  --l1b:#40261A; --l1f:#F2AA84; --l0b:#43202A; --l0f:#F49AAB; --warn:#F0C56C; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.45); --pen-grad:linear-gradient(135deg,#97B5FF,#7EA2FF); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);
  padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px}
.top > *{max-width:760px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:1.15rem;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:10px;background:var(--pen-grad);color:var(--pen-ink);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 2px 6px rgba(31,79,184,.3)}
.logo svg{width:18px;height:18px}
.brand small{color:var(--pen);background:var(--pen-soft);font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small:empty{display:none}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pickers label{display:flex;flex-direction:column;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);gap:2px;min-width:0}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
select:disabled{opacity:.6}
main{padding:16px 16px 96px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 90%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;padding:6px 2px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--muted);transition:color .15s}
.nav button svg{width:24px;height:24px;padding:2px 14px;box-sizing:content-box;border-radius:999px;transition:background .2s}
.nav button[aria-current="page"]{color:var(--pen);font-weight:700}
.nav button[aria-current="page"] svg{background:var(--pen-soft)}
@media (min-width:760px){.nav{left:50%;right:auto;transform:translateX(-50%);width:440px;bottom:12px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:4px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;transition:transform .08s,background .15s,box-shadow .15s}
.btn:not(:disabled):hover{border-color:color-mix(in srgb,var(--pen) 35%,var(--line))}
.btn:not(:disabled):active,.iconbtn:active,.seg button:active,.lvls button:not(:disabled):active,.item[data-a]:active{transform:scale(.97)}
.btn.primary{background:var(--pen-grad);border-color:transparent;color:var(--pen-ink);box-shadow:0 2px 8px rgba(31,79,184,.25)}
.btn.primary:not(:disabled):hover{box-shadow:0 4px 14px rgba(31,79,184,.32)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--l0f)}
.btn.confirm{background:var(--l0b);color:var(--l0f);border-color:var(--l0f)}
.btn:disabled{opacity:.5;cursor:default}
.banner{background:var(--l2b);color:var(--l2f);border-radius:12px;padding:10px 12px 10px 40px;font-size:.88rem;position:relative}
.banner::before{content:"!";position:absolute;left:12px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--l2f);color:var(--l2b);font-weight:700;font-size:.8rem;display:grid;place-items:center;line-height:1}
.card .banner{padding-left:12px}.card .banner::before{display:none}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:1.25rem}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.card .list{box-shadow:none}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:56px}
.item:first-child{border-top:0}
button.item{transition:background .15s}button.item:hover{background:var(--paper)}
.av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.02em;background:hsl(var(--h) 70% 92%);color:hsl(var(--h) 55% 32%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 80% 82%)}}
:root[data-theme="dark"] .av{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 80% 82%)}
.mini{display:block;height:4px;border-radius:99px;background:var(--line);margin-top:5px;max-width:160px;overflow:hidden}.mini i{display:block;height:100%;background:var(--pen);border-radius:inherit}
.item .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-weight:700;line-height:1.25}
.item .sub{font-size:.78rem;color:var(--muted);font-weight:400}
.seg{display:inline-grid;grid-template-columns:repeat(3,auto);gap:2px;padding:3px;background:var(--paper);border:1px solid var(--line);border-radius:12px;flex:0 0 auto}
.seg button{border:0;background:transparent;padding:7px 10px;font-size:.85rem;font-weight:700;color:var(--muted);border-radius:9px;transition:background .15s,color .15s,transform .08s}
.seg button[aria-pressed="true"]{box-shadow:0 1px 3px rgba(22,32,58,.12)}
.seg button[aria-pressed="true"].ok{background:var(--l4b);color:var(--l4f)}
.seg button[aria-pressed="true"].no{background:var(--l0b);color:var(--l0f)}
.seg button[aria-pressed="true"].abs{background:var(--surface);color:var(--ink)}
.pill{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;border-radius:999px;padding:4px 11px;font-size:.95rem;flex:0 0 auto;min-width:3.4em;text-align:center}
.lv4{background:var(--l4b);color:var(--l4f)} .lv3{background:var(--l3b);color:var(--l3f)} .lv2{background:var(--l2b);color:var(--l2f)}
.lv1{background:var(--l1b);color:var(--l1f)} .lv0{background:var(--l0b);color:var(--l0f)} .lvn{background:var(--pen-soft);color:var(--muted)}
.chev{color:var(--muted);flex:0 0 auto}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);text-align:left;box-shadow:var(--shadow);transition:border-color .15s}
.tog[aria-pressed="true"]{border-color:var(--pen)}
.tog .sw{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.tog[aria-pressed="true"] .sw{background:var(--pen)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(16px)}
.tog span.t{font-size:.88rem;line-height:1.2;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;line-height:1.1}
.stats b{font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.72rem;margin-top:2px}
.stats .lvn{color:var(--ink)}.stats .lvn span{color:var(--muted)}
.dlabel{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--ink);display:block;margin-bottom:4px}
.dlabel::first-letter{text-transform:uppercase}
@media (max-width:440px){.item.att .av{display:none}.item.att .nm{font-size:.95rem}}
/* evaluation sheet */
.sheet{position:fixed;inset:0;z-index:10;background:var(--paper);display:flex;flex-direction:column}
.sheet.anim{animation:up .22s ease-out}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sheet-h{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.sheet-h > *{max-width:760px;width:100%;margin:0 auto}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--pen-grad);border-radius:inherit;transition:width .25s}
.sheet-h .row{flex-wrap:nowrap}
.sheet-h h2{font-size:1.1rem;overflow-wrap:anywhere}
.big{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;border-radius:14px;padding:2px 14px;min-width:2.8em;text-align:center}
.sheet-b{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-b > *{max-width:760px;width:100%;margin:0 auto}
.crit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);border-left:4px solid var(--line);transition:border-color .2s}
.crit.done{border-left-color:var(--pen)}
.card .crit{box-shadow:none;border-left-width:1px}
.crit.extra{border-style:dashed}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ch b{font-family:var(--f-display);font-size:1rem}
.ch .w{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--paper);padding:2px 8px;border-radius:999px}
.ch .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--pen-soft);color:var(--pen);font-size:.78rem;margin-right:8px;vertical-align:1px}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvls.two{grid-template-columns:1fr 1fr}
.lvls button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;line-height:1.1;position:relative;overflow:hidden;transition:background .15s,color .15s,transform .08s}
.lvls button::after{content:"";position:absolute;left:30%;right:30%;bottom:3px;height:3px;border-radius:99px;opacity:.55}
.lvls button.lv4::after{background:var(--l4f)}.lvls button.lv3::after{background:var(--l3f)}.lvls button.lv2::after{background:var(--l2f)}.lvls button.lv1::after{background:var(--l1f)}.lvls button.lv0::after{background:var(--l0f)}
.lvls button[aria-pressed="true"]::after{opacity:0}
.lvls button b{font-family:var(--f-display);font-size:1.15rem}
.lvls button span{font-size:.68rem;color:var(--muted)}
.lvls button[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.lvls button[aria-pressed="true"] span{color:inherit}
.lvls button.lv4[aria-pressed="true"]{background:var(--l4b);color:var(--l4f)}
.lvls button.lv3[aria-pressed="true"]{background:var(--l3b);color:var(--l3f)}
.lvls button.lv2[aria-pressed="true"]{background:var(--l2b);color:var(--l2f)}
.lvls button.lv1[aria-pressed="true"]{background:var(--l1b);color:var(--l1f)}
.lvls button.lv0[aria-pressed="true"]{background:var(--l0b);color:var(--l0f)}
.lvls button[aria-pressed="false"]{color:var(--ink)}
.sheet-h .btn{white-space:nowrap;padding:8px 10px}
.lvls button:disabled{opacity:.45}
.desc{margin:0;font-size:.9rem;color:var(--ink);background:var(--paper);border-radius:10px;padding:9px 12px}
.desc.none{color:var(--muted)}
.auto{font-size:.82rem;color:var(--muted)}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--pen-soft);color:var(--pen)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--paper) 60%,var(--surface))}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--pen-soft)}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.88rem;min-width:100%}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);min-width:9em;max-width:46vw;white-space:normal;overflow-wrap:break-word;z-index:1}
td:first-child{font-weight:700}
td.auto-v{font-style:italic;color:var(--muted)}
.legend{font-size:.8rem;color:var(--muted);display:grid;gap:2px}
.section-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-t h2{font-size:1.1rem;letter-spacing:-.01em}
.preview{font-size:.85rem;background:var(--paper);border-radius:8px;padding:8px 10px;max-height:180px;overflow:auto}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapgrid label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted);min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:20;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow-lg);animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.datebar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;transition:transform .08s,background .15s}
.iconbtn:hover{background:var(--paper)}
details > summary{cursor:pointer;color:var(--pen);font-weight:700}
.empty .logo{width:56px;height:56px;border-radius:16px}.empty .logo svg{width:30px;height:30px}
.iconbtn svg{width:20px;height:20px}
@media (max-width:380px){.seg button{padding:8px 7px}.lvls button span{font-size:.6rem}}
@media (max-width:360px){.stats b{font-size:1.2rem}.av{display:none}}
input[type=checkbox]{accent-color:var(--pen);width:18px;height:18px;margin:0;flex:0 0 auto}
.check{display:flex;align-items:flex-start;gap:8px;cursor:pointer}.check input{margin-top:2px}
.seg.opt{grid-template-columns:repeat(3,1fr);width:100%}
.seg.opt button[aria-pressed="true"]{background:var(--pen-soft);color:var(--pen)}
.danger-zone{border-color:color-mix(in srgb,var(--l0f) 35%,var(--line))}
.thr{display:flex;flex-wrap:wrap;gap:6px}
.thr span{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;box-shadow:var(--shadow)}
.legend span{display:flex;gap:8px;align-items:baseline}
.legend .num{flex:0 0 auto;min-width:22px;height:20px;padding:0 5px;border-radius:6px;background:var(--pen-soft);color:var(--pen);font-weight:700;font-size:.72rem;display:inline-grid;place-items:center}
.legend em{font-style:normal;color:var(--muted);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend .note{grid-column:1/-1;font-size:.76rem;display:block;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.tablewrap td.c4,.tablewrap td.c3,.tablewrap td.c2,.tablewrap td.c1,.tablewrap td.c0{font-weight:700}
.tablewrap td.c4{background:var(--l4b);color:var(--l4f)}.tablewrap td.c3{background:var(--l3b);color:var(--l3f)}.tablewrap td.c2{background:var(--l2b);color:var(--l2f)}
.tablewrap td.c1{background:var(--l1b);color:var(--l1f)}.tablewrap td.c0{background:var(--l0b);color:var(--l0f)}
td.dot{color:var(--line)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 16px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--pen-soft);border-top-color:var(--pen);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:4px}

// ---------- storage adapters ----------
function makeQueue(writer){
  const pend=new Map(), timers=new Map(), chains=new Map(), dirty=new Set();
  function schedule(path,data){pend.set(path,data);dirty.add(path);clearTimeout(timers.get(path));timers.set(path,setTimeout(()=>flush(path),500))}
  function flush(path){
    clearTimeout(timers.get(path));timers.delete(path);
    if(!pend.has(path))return;
    const data=pend.get(path);pend.delete(path);
    const prev=chains.get(path)||Promise.resolve();
    const p=prev.then(()=>writer(path,data)).catch(e=>{console.warn("save",path,e);toast(e&&e.code==="quota_exceeded"?"No hay espacio para guardar más datos.":"No se ha podido guardar. Revisa la conexión.")})
      .then(()=>{if(!pend.has(path))dirty.delete(path)});
    chains.set(path,p);
  }
  function flushAll(){[...pend.keys()].forEach(flush)}
  return {schedule,flushAll,isDirty:p=>dirty.has(p),cancel:p=>{clearTimeout(timers.get(p));pend.delete(p);dirty.delete(p)}};
}
function dbStore(db,userId){
  const base="data/users/"+userId;
  const q=makeQueue((path,data)=>db.doc(base+"/"+path).set(data));
  return {
    kind:"db",q,
    onGroups(cb){return db.collection(base).onSnapshot(s=>{const o={};let pr=null;s.docs.forEach(d=>{const v=d.data();if(v&&v.kind==="group")o[d.id]=clone(v);else if(v&&v.kind==="profile"&&d.id==="profile")pr=clone(v)});cb(o,pr)},e=>{console.warn(e);toast("Se ha perdido la conexión con tus datos. Recarga la página.")})},
    onUnits(gid,cb){return db.collection(base+"/"+gid+"/units").onSnapshot(s=>{const o={};s.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=clone(v)});cb(o)},e=>console.warn(e))},
    put(path,data){q.schedule(path,data)},
    async getUnits(gid){const s=await db.collection(base+"/"+gid+"/units").get();const o={};s.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=clone(v)});return o},
    async del(path){q.cancel(path);try{await db.doc(base+"/"+path).delete()}catch(e){toast("No se ha podido borrar.")}}
  };
}
function localStore(){
  const KEY="rc.localdata";let data=lsGet(KEY,{groups:{},units:{}});let gcb=null;const ucbs={};
  const save=()=>lsSet(KEY,data);
  const q=makeQueue((path,doc)=>{const p=path.split("/");if(path==="profile"){data.profile=clone(doc)}else if(p.length===1){data.groups[p[0]]=clone(doc)}else{(data.units[p[0]]=data.units[p[0]]||{})[p[2]]=clone(doc)}save()});
  return {kind:"local",q,
    onGroups(cb){gcb=cb;cb(clone(data.groups),data.profile?clone(data.profile):null);return()=>{gcb=null}},
    onUnits(gid,cb){ucbs[gid]=cb;cb(clone(data.units[gid]||{}));return()=>{delete ucbs[gid]}},
    put(path,doc){q.schedule(path,doc)},
    async getUnits(gid){return clone(data.units[gid]||{})},
    async del(path){q.cancel(path);const p=path.split("/");if(p.length===1){delete data.groups[p[0]];delete data.units[p[0]]}else if(data.units[p[0]])delete data.units[p[0]][p[2]];save()}
  };
}
async function init(){
  applyTheme(S.theme);
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyTheme(S.theme))}catch(e){}
  render();
  let db=null,user=null,id=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}
    if(db&&user){try{id=await user.id()}catch(e){}}
  }
  if(db&&id){store=dbStore(db,id);S.mode="db"}else{store=localStore();S.mode="local"}
  store.onGroups((g,pr)=>{
    if(!store.q.isDirty("profile"))S.profile=pr||null;
    const merged={};
    Object.keys(g).forEach(k=>{merged[k]=store.q.isDirty(k)&&S.groups[k]?S.groups[k]:g[k]});
    Object.keys(S.groups).forEach(k=>{if(store.q.isDirty(k)&&!merged[k])merged[k]=S.groups[k]});
    S.groups=merged;
    if(!S.gid||!S.groups[S.gid])S.gid=sortedGroups()[0]?.id||null;
    subscribeUnits();render();
  });
  addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")store.q.flushAll()});
  addEventListener("pagehide",()=>store.q.flushAll());
}
function subscribeUnits(){
  if(unitsFor===S.gid)return;
  if(unsubUnits){unsubUnits();unsubUnits=null}
  unitsFor=S.gid;S.units={};
  if(!S.gid)return;
  const gid=S.gid;
  unsubUnits=store.onUnits(gid,u=>{
    if(gid!==S.gid)return;
    const merged={};
    Object.keys(u).forEach(k=>{const p=gid+"/units/"+k;merged[k]=store.q.isDirty(p)&&S.units[k]?S.units[k]:u[k]});
    Object.keys(S.units).forEach(k=>{if(store.q.isDirty(gid+"/units/"+k)&&!merged[k])merged[k]=S.units[k]});
    S.units=merged;
    if(!S.uid||!S.units[S.uid]){const us=sortedUnits();S.uid=us.length?us[us.length-1].id:null}
    render();
  });

const norm=s=>String(s==null?"":s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function parseDelimited(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/).find(l=>l.trim())||"";
  const cands=["\t",";",","];let delim=cands.map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0];
  delim=delim[1]>1?delim[0]:"\u0000";
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c}
  row.push(cell);rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()));
}
function analyse(rows){
  rows=rows.map(r=>r.map(c=>c==null?"":String(c).trim())).filter(r=>r.some(c=>c));
  const isName=/^(nombre|name|first ?name|nombres?|apellidos?|surnames?|last ?name|alumn[oa]s?|alumno\/a|estudiantes?|students?|nombre completo|full ?name|apellidos,? nombre|apellidos y nombre)$/;
  // iDoceo gradebook CSV: first header cell empty, other headers are grade columns, names in column A ("Nombre Apellidos")
  if(rows.length>1&&rows[0][0]===""&&rows[0].slice(1).some(c=>c)&&rows.slice(1).some(r=>r[0])){
    const ncols=Math.max(...rows.map(r=>r.length));
    const cols=[...Array(ncols)].map((_,i)=>i===0?"Alumno/a (columna A)":(rows[0][i]||"Columna "+String.fromCharCode(65+(i%26))));
    return {rows:rows.slice(1),cols,mode:"full",nom:0,ape:Math.min(1,ncols-1),full:0,header:true,idoceo:true};
  }
  let h=-1;for(let i=0;i<Math.min(10,rows.length);i++){if(rows[i].some(c=>isName.test(norm(c)))){h=i;break}}
  const head=h>=0?rows[h]:null;const ncols=Math.max(...rows.map(r=>r.length));
  const cols=[...Array(ncols)].map((_,i)=>head&&head[i]?head[i]:"Columna "+String.fromCharCode(65+(i%26)));
  let nom=-1,ape=-1,full=-1;
  if(head){head.forEach((c,i)=>{const n=norm(c);
    if(nom<0&&/^(nombre|nombres|name|first ?name)$/.test(n))nom=i;
    else if(ape<0&&/^(apellidos?|surnames?|last ?name|primer apellido)$/.test(n))ape=i;
    else if(full<0&&/(alumn|estudiante|student|completo|full ?name|apellidos,? nombre|apellidos y nombre)/.test(n))full=i;})}
  let mode;if(nom>=0&&ape>=0)mode="split";else{mode="full";if(full<0)full=nom>=0?nom:(ape>=0?ape:0)}
  if(full<0)full=0;if(nom<0)nom=0;if(ape<0)ape=Math.min(1,ncols-1);
  return {rows:rows.slice(h+1),cols,mode,nom,ape,full,header:!!head};
}
function impStudents(imp){
  const out=[];const seen=new Set();
  imp.rows.forEach(r=>{
    let nombre="",apellidos="";
    if(imp.mode==="split"){nombre=r[imp.nom]||"";apellidos=r[imp.ape]||""}
    else{const v=(r[imp.full]||"").trim();if(v.includes(",")){apellidos=v.split(",")[0].trim();nombre=v.split(",").slice(1).join(",").trim()}else nombre=v}
    nombre=nombre.trim();apellidos=apellidos.trim();
    if(!nombre&&!apellidos)return;
    if(/^(media|promedio|total|average)$/i.test(nombre))return;
    const key=norm(apellidos+"|"+nombre);if(seen.has(key))return;seen.add(key);
    out.push({nombre,apellidos,order:out.length+1});
  });
  return out;
}

async function makePDF(list,title){
  let J;try{J=await loadPDF()}catch(e){toast("No se ha podido cargar el generador de PDF. Revisa la conexión.");return null}
  const u=U(),g=G(),o=pdfOpts();
  const doc=new J({unit:"mm",format:"a4"});doc.setLineHeightFactor(1.25);
  // dry-run each report on a scratch document to pick the density that keeps it on one page
  const fit=s=>{for(const K of [PDF_ROOMY,PDF_COMPACT]){const t=new J({unit:"mm",format:"a4"});t.setLineHeightFactor(1.25);pdfStudent(t,u,g,s,o,K);if(t.getNumberOfPages()===1)return K}return PDF_ROOMY};
  list.forEach((s,i)=>{if(i){if(o.duplex&&doc.getNumberOfPages()%2)doc.addPage();doc.addPage()}pdfStudent(doc,u,g,s,o,fit(s))});
  doc.setProperties({title:pdfTxt(title),author:o.teacher?pdfTxt(o.tname):"",creator:"Rúbrica cuaderno"});
  return doc.output("blob");
}
async function saveFile(fname,blob,okMsg){
  let dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
  if(!dl){if(browserSave(fname,blob)){toast(okMsg);return true}toast("La descarga no está disponible aquí");return false}
  try{await dl.save({filename:fname,data:blob});toast(okMsg);return true}catch(e){if(!(e&&e.code==="declined"))toast("No se ha podido guardar el archivo");return false}
}
const fileSafe=t=>t.replace(/[\\/:*?"<>|]/g,"-");

async function pdfAll(){

function renderSheet(){

  const card=(c,extra,num)=>{
    const r=raw(u,s.id,c.k),v=val(u,s.id,c.k);const auto=r==null&&v!=null;
    const disabled=c.k==="f2"&&raw(u,s.id,"f1")===0;
    const d=c.binary?(v==null?null:c.d[v]):(v==null?null:c.d[4-v]);
    let note="";
    if(c.k==="c8"){const a=attStats(u,s.id);note=`<div class="auto">Atención registrada: ${a.ok} de ${plural(a.ok+a.no,"día","días")}${a.ab?` · ${plural(a.ab,"falta","faltas")}`:""}${auto?' · <span class="tag">automático</span>':r!=null&&suggest8(u,s.id)!=null?` · sugerido ${suggest8(u,s.id)} <button class="btn ghost small" data-a="score" data-s="${s.id}" data-k="c8" data-v="${r}" style="padding:2px 8px">usar sugerido</button>`:""}</div>`}
    if(disabled)note=`<div class="auto">Sin ficha entregada, las actividades cuentan 0.</div>`;
    const btns=c.binary?[[4,"Sí","Entrega"],[0,"No","No entrega"]].map(([n,a,b])=>`<button class="lv${n}" data-a="score" data-s="${s.id}" data-k="${c.k}" data-v="${n}" aria-pressed="${v===n}"><b>${a}</b><span>${b}</span></button>`).join("")
      :[4,3,2,1,0].map(n=>`<button class="lv${n}" data-a="score" data-s="${s.id}" data-k="${c.k}" data-v="${n}" aria-pressed="${v===n}" ${disabled?"disabled":""}><b>${n}</b><span>${SHORT[n]}</span></button>`).join("");
    return `<section class="crit ${extra?"extra":""} ${v!=null?"done":""}"><div class="ch"><b>${num?`<span class="num">${num}</span>`:""}${esc(c.n)}</b><span class="w">${extra||fmt(c.w,0)+" %"}</span></div>
     <div class="lvls ${c.binary?"two":""}">${btns}</div>${note}
     <p class="desc ${d?"":"none"}">${d?esc(d):"Toca un nivel para ver su descripción."}</p></section>`;
  };
  const cl=critList(u);
  el.innerHTML=`<div class="sheet${opening?" anim":""}" role="dialog" aria-modal="true" aria-label="Evaluar a ${esc(dispName(s))}">
   <div class="sheet-h"><div class="row"><button class="iconbtn" data-a="close" aria-label="Volver a la lista">${ICON.close}</button>
     <h2 class="grow">${esc(dispName(s))}</h2><span class="big ${lvClass(g.final)}">${fmt(g.final)}</span></div>
     <div class="row"><button class="btn" data-a="nav" data-d="-1" ${idx>0?"":"disabled"}>‹ Anterior</button>
     <span class="grow small muted" style="text-align:center">${idx+1} de ${st.length} · ${g.done}/${g.total}${g.bonus?` · +${fmt(g.bonus,2)} extra`:""}</span>
     <button class="btn" data-a="nav" data-d="1" ${idx<st.length-1?"":"disabled"}>Siguiente ›</button></div>
     <div class="prog" role="progressbar" aria-label="Criterios puntuados" aria-valuemin="0" aria-valuemax="${g.total}" aria-valuenow="${g.done}"><i style="width:${Math.round(g.done/g.total*100)}%"></i></div></div>
   <div class="sheet-b">${cl.map((c,i)=>card(c,"",i<8?i+1:"")).join("")}${u.vol?card(VOL,"extra hasta +"+fmt(u.volMax||1,1)):""}
   ${g.partial?`<p class="small muted">Faltan ${g.total-g.done} criterios: la nota mostrada es provisional y se calcula con los criterios ya puntuados.</p>`:""}
   <section class="crit"><div class="ch"><b><label for="obs-${s.id}">Observaciones para el informe</label></b><span class="w">PDF</span></div>
    <textarea id="obs-${s.id}" data-keep="1" data-obs="${s.id}" rows="3" placeholder="Aclaraciones sobre la nota o posibles malentendidos">${esc((u.notes||{})[s.id]||"")}</textarea>
    <span class="auto">Salen en su informe. Si lo dejas vacío, el PDF lleva un recuadro en blanco para escribir a mano.</span>
    <button class="btn primary" data-a="pdf1" data-s="${s.id}">PDF de este alumno</button></section></div></div>`;
  el.hidden=false;document.body.style.overflow="hidden";
  const nb=el.querySelector(".sheet-b");if(nb)nb.scrollTop=scroll;

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a!=="delst"&&a!=="delunit"&&a!=="delgroup"&&a!=="restore")S.confirm=null;
  const u=U(),g=G();
  switch(a){
   case "tab":S.tab=b.dataset.tab;lsSet("rc.tab",S.tab);window.scrollTo(0,0);break;
   case "goto":S.tab=b.dataset.tab;lsSet("rc.tab",S.tab);break;
   case "att":setAtt(b.dataset.s,b.dataset.v);break;
   case "allok":{const d=(u.att=u.att||{})[S.date]=(u.att[S.date]||{});students().forEach(s=>{if(!d[s.id])d[s.id]="ok"});saveUnit(S.uid);break}
   case "day":{const d=new Date(S.date+"T12:00:00");d.setDate(d.getDate()+Number(b.dataset.d));d.setMinutes(d.getMinutes()-d.getTimezoneOffset());S.date=d.toISOString().slice(0,10);break}

   case "nav":{const st=students();const i=st.findIndex(s=>s.id===S.evalSid)+Number(b.dataset.d);if(st[i]){S.evalSid=st[i].id;const sb=$("#sheet .sheet-b");if(sb)sb.scrollTop=0}break}
   case "score":setScore(b.dataset.s,b.dataset.k,Number(b.dataset.v));break;

   case "restorecancel":S.restore=null;break;
   case "export":doExport();return;

   case "idoexportx":idoExportX();return;

   case "pickg":S.gid=b.dataset.g;lsSet("rc.gid",S.gid);S.uid=null;subscribeUnits();break;
   case "demo":{const names=[["Lucía","Benítez Soler"],["Marcos","Carrasco Vidal"],["Irene","Domínguez Ortega"],["Hugo","Ferrer Lozano"],["Nerea","Gallardo Pons"],["Adrián","Herrera Molina"],["Carla","Iglesias Rey"],["Óscar","Jiménez Navas"]];
     createGroup("Ejemplo 3º ESO",names.map(([n,a])=>({id:newId("s"),nombre:n,apellidos:a})));S.tab="hoy";lsSet("rc.tab","hoy");toast("Grupo de ejemplo creado");break}
   case "newunit":{const n=$("#newU").value.trim()||("Unidad "+(sortedUnits().length+1));createUnit(n);toast("Unidad añadida");break}
   case "newunit-quick":createUnit("Unidad 1");break;
   case "delunit":{const id=b.dataset.u;if(S.confirm!=="du"+id){S.confirm="du"+id;break}S.confirm=null;store.del(S.gid+"/units/"+id);delete S.units[id];if(S.uid===id){const us=sortedUnits();S.uid=us.length?us[us.length-1].id:null}toast("Unidad borrada");break}
   case "delgroup":{if(S.confirm!=="dg"){S.confirm="dg";break}S.confirm=null;const gid=S.gid;Object.keys(S.units).forEach(id=>store.del(gid+"/units/"+id));store.del(gid);delete S.groups[gid];S.gid=sortedGroups()[0]?.id||null;S.uid=null;unitsFor=null;subscribeUnits();toast("Grupo borrado");break}
   case "delst":{const id=b.dataset.s;if(S.confirm!=="ds"+id){S.confirm="ds"+id;break}S.confirm=null;g.students=(g.students||[]).filter(s=>s.id!==id);saveGroup(S.gid);break}
   case "addst":{const n=$("#addNom").value.trim(),ap=$("#addApe").value.trim();if(!n&&!ap){toast("Escribe el nombre");return}const mx=Math.max(0,...(g.students||[]).map(s=>typeof s.order==="number"?s.order:0));g.students=[...(g.students||[]),{id:newId("s"),nombre:n,apellidos:ap,order:mx+1}];saveGroup(S.gid);toast("Alumno añadido");break}
   case "paste":{const t=$("#pasteIn").value;if(!t.trim()){toast("Pega primero la lista");return}S.imp=analyse(parseDelimited(t));break}
   case "impadd":applyImport(false);return;
   case "imprep":applyImport(true);return;
   case "impcancel":S.imp=null;break;
   default:return;
  }
  render();
});
document.addEventListener("change",async e=>{
  const t=e.target;const g=G();
  if(t.id==="selG"){S.gid=t.value;lsSet("rc.gid",S.gid);S.uid=null;S.evalSid=null;subscribeUnits();render();return}
  if(t.id==="selU"){S.uid=t.value;lsSet("rc.unit",S.uid);S.evalSid=null;render();return}
  if(t.id==="dateIn"&&t.value){S.date=t.value;render();return}
  if(t.id==="profName"){setProf({name:t.value.trim()});render();return}
  if(t.id==="profSubj"){const lang=g&&g.lang==="va"?"va":"es";setProf({subj:{...prof().subj,[lang]:t.value.trim()}});render();return}
  if(t.id==="idoCol"){const u=U();if(u){u.idoceoCol=t.value.trim();saveUnit(S.uid)}return}
  if(t.id==="idoDec"){S.idoDec=t.value;lsSet("rc.idoDec",t.value);return}
  if(t.id==="idoBlank"){S.idoBlank=t.checked;render();return}
  if(t.id==="nameFmt"&&g){g.nameFormat=t.value;saveGroup(S.gid);render();return}
  if(t.id==="restoreIn"&&t.files&&t.files[0]){await readBackup(t.files[0]);t.value="";return}
  if(t.id==="fileIn"&&t.files&&t.files[0]){
    try{S.imp=analyse(await readFile(t.files[0]));if(!S.imp.rows.length)toast("El archivo no tiene filas con datos")}
    catch(err){toast(err&&err.message==="noxlsx"?"No se ha podido cargar el lector de Excel. Prueba con CSV.":"No se ha podido leer el archivo")}
    t.value="";render();return}
  if(S.imp&&["impMode","impNom","impApe","impFull"].includes(t.id)){const k={impMode:"mode",impNom:"nom",impApe:"ape",impFull:"full"}[t.id];S.imp[k]=t.id==="impMode"?t.value:Number(t.value);render();return}
  const f=t.dataset&&t.dataset.f;if(f){const u=S.units[t.dataset.u];if(!u)return;
    if(f==="uname"){u.name=t.value.trim()||u.name}
    else if(f==="uficha")u.ficha=t.checked;else if(f==="uvol")u.vol=t.checked;else if(f==="uvolmax")u.volMax=Number(t.value);
    store.put(S.gid+"/units/"+t.dataset.u,u);render()}
});
document.addEventListener("input",e=>{
  const t=e.target;const sid=t.dataset&&t.dataset.obs;if(!sid)return;
  const u=U();if(!u)return;u.notes=u.notes||{};
  if(t.value.trim())u.notes[sid]=t.value;else delete u.notes[sid];
  saveUnit(S.uid);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.evalSid){S.evalSid=null;render()}});
init();
})();
</script>

</body>
</html>
